<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой Дневник — C37 FUEL</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container" style="padding: 60px 20px; max-width: 900px; margin: 0 auto;">
    <h1 class="reveal" style="font-size: 3rem; margin-bottom: 10px; color: var(--accent); font-weight: 900; text-align: center;">ТВОЙ ПРОГРЕСС</h1>
    
    <!-- ДАШБОРД КБЖУ -->
    <div class="diary-dashboard reveal">
        <div class="macro-card">
            <div class="macro-title">Калории</div>
            <div class="macro-value"><span id="total-calories">0</span> / 2000</div>
            <div class="progress-line"><div class="progress-fill" id="calories-bar"></div></div>
        </div>
        <div class="macro-card">
            <div class="macro-title">Белки</div>
            <div class="macro-value"><span id="total-protein">0</span> г / 120</div>
            <div class="progress-line"><div class="progress-fill" id="protein-bar"></div></div>
        </div>
        <div class="macro-card">
            <div class="macro-title">Жиры</div>
            <div class="macro-value"><span id="total-fat">0</span> г / 70</div>
            <div class="progress-line"><div class="progress-fill" id="fat-bar"></div></div>
        </div>
        <div class="macro-card">
            <div class="macro-title">Углеводы</div>
            <div class="macro-value"><span id="total-carbs">0</span> г / 200</div>
            <div class="progress-line"><div class="progress-fill" id="carbs-bar"></div></div>
        </div>
    </div>

    <!-- УМНЫЙ ВВОД ЕДЫ -->
    <div class="ai-food-input reveal" style="margin-top: 30px;">
        <h3>Что ты сегодня ел(а)?</h3>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 10px;">Напиши простыми словами: «Два яйца и кофе с молоком», «Гречка с котлетой».</p>
        <textarea id="food-input" placeholder="Например: Съел тарелку овсянки с бананом и выпил стакан кефира..."></textarea>
        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="analyzeFood()" id="btn-analyze">✨ Посчитать через ИИ</button>
    </div>

    <!-- СПИСОК СЪЕДЕННОГО -->
    <div class="food-list-container reveal" style="margin-top: 30px;">
        <h3>Съедено за сегодня:</h3>
        <ul id="food-list" class="food-list">
            <li style="color:#777; text-align:center; padding: 20px;">Пока пусто. Напиши, что съел!</li>
        </ul>
        <button class="btn-outline" style="width:100%; margin-top:10px; font-size:0.9rem;" onclick="resetFood()">Очистить дневник еды</button>
    </div>

    <hr style="border-color: #333; margin: 50px 0;">

    <!-- ВЕС И ГРАФИК -->
    <h2 class="reveal" style="font-size: 2rem; margin-bottom: 20px; color: var(--accent); text-align: center;">Трекер веса</h2>
    
    <div class="weight-input-card reveal">
        <div class="weight-input-group">
            <label>Мой текущий вес (кг):</label>
            <input type="number" id="current-weight" placeholder="75.5" step="0.1">
            <button class="btn" onclick="saveWeight()">Записать</button>
        </div>
        <div class="weight-input-group" style="margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;">
            <label>Моя цель (кг):</label>
            <input type="number" id="target-weight" placeholder="70" step="0.1" onchange="saveTargetWeight()">
        </div>
    </div>

    <div class="chart-container reveal" style="margin-top: 20px; background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid var(--border);">
        <canvas id="weightChart" style="width: 100%; height: 300px;"></canvas>
    </div>

    <!-- ИИ АНАЛИЗ -->
    <div style="text-align: center; margin: 50px 0;">
        <button class="btn" style="font-size: 1.2rem; padding: 18px 40px;" onclick="askEvaAboutProgress()">✨ Спросить ЭЙВУ о прогрессе</button>
    </div>

</div>

<div id="footer-placeholder"></div>

<script src="script.js"></script>
<script>
  async function loadComponents() {
    try {
      const headerRes = await fetch('header.html');
      document.getElementById('header-placeholder').innerHTML = await headerRes.text();
      const footerRes = await fetch('footer.html');
      document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
      if (typeof updateCartCount === 'function') updateCartCount();
      
      const revealElements = document.querySelectorAll('.reveal');
      const revealOnScroll = new IntersectionObserver(function(entries, observer) {
          entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('active');
              observer.unobserve(entry.target);
          });
      }, { threshold: 0.15 });
      revealElements.forEach(el => revealOnScroll.observe(el));

    } catch (error) {
      console.error('Ошибка загрузки компонентов:', error);
    }
  }
  loadComponents();
</script>
</body>
</html>
