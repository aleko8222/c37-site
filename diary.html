<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой Дневник — C37 FUEL</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container" style="padding: 60px 20px; max-width: 900px; margin: 0 auto;">
    
    <!-- ШАПКА ДНЕВНИКА: СТРИК И КОЛЬЦО -->
    <div class="diary-header reveal">
        <div class="diary-ring">
            <div class="ring-text"><span id="day-count">1</span><br><small>ДЕНЬ</small></div>
        </div>
        <div class="diary-streak">
            <div class="fire-icon">🔥</div>
            <div>
                <div style="font-size: 1.5rem; font-weight: 900;" id="streak-count">0</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">ДНЕЙ ПОДРЯД</div>
            </div>
        </div>
        <div class="diary-goal-box">
            <div style="font-size: 0.8rem; color: var(--text-muted);">ЦЕЛЬ НА ДЕНЬ</div>
            <div style="font-size: 1.2rem; font-weight: bold; color: var(--accent);" id="daily-cal-goal">0 ккал</div>
        </div>
    </div>

    <!-- СЛОТЫ ПИТАНИЯ -->
    <h2 class="reveal" style="margin-top: 40px; font-size: 1.5rem;">Приемы пищи на сегодня</h2>
    <div class="slots-grid reveal">
        <div class="slot-card" id="slot-breakfast">
            <div class="slot-title">🌅 Завтрак</div>
            <div class="slot-desc">Белки + сложные углеводы</div>
            <div class="slot-actions">
                <button class="btn-slot eaten" onclick="markSlot('breakfast', 'eaten')">Съел</button>
                <button class="btn-slot skipped" onclick="markSlot('breakfast', 'skipped')">Пропустил</button>
            </div>
        </div>
        <div class="slot-card" id="slot-lunch">
            <div class="slot-title">☀️ Обед</div>
            <div class="slot-desc">Белок + овощи</div>
            <div class="slot-actions">
                <button class="btn-slot eaten" onclick="markSlot('lunch', 'eaten')">Съел</button>
                <button class="btn-slot skipped" onclick="markSlot('lunch', 'skipped')">Пропустил</button>
            </div>
        </div>
        <div class="slot-card" id="slot-dinner">
            <div class="slot-title">🌙 Ужин</div>
            <div class="slot-desc">Легкий белок</div>
            <div class="slot-actions">
                <button class="btn-slot eaten" onclick="markSlot('dinner', 'eaten')">Съел</button>
                <button class="btn-slot skipped" onclick="markSlot('dinner', 'skipped')">Пропустил</button>
            </div>
        </div>
        <div class="slot-card" id="slot-snacks">
            <div class="slot-title">🍎 Перекус</div>
            <div class="slot-desc">Батончик C37</div>
            <div class="slot-actions">
                <button class="btn-slot eaten" onclick="markSlot('snacks', 'eaten')">Съел</button>
                <button class="btn-slot skipped" onclick="markSlot('snacks', 'skipped')">Пропустил</button>
            </div>
        </div>
    </div>

    <!-- БЫСТРОЕ ДОБАВЛЕНИЕ БАТОНЧИКОВ -->
    <div class="quick-add-c37 reveal" style="margin-top: 30px;">
        <h3>Съел батончик C37? Отметь:</h3>
        <div class="quick-buttons">
            <button onclick="addSnackC37('Протеин База', 170)">Протеин База</button>
            <button onclick="addSnackC37('Коллаген Лайт', 220)">Коллаген Лайт</button>
            <button onclick="addSnackC37('Энергия Дисциплины', 170)">Энергия</button>
            <button onclick="addSnackC37('Восстановление', 170)">Восстановление</button>
            <button onclick="addSnackC37('Экстрим', 220)">Экстрим</button>
        </div>
        <p style="margin-top: 10px; font-size: 0.9rem; color: #aaa;">Съедено батончиков: <strong id="snack-count" style="color:var(--accent);">0</strong></p>
    </div>

    <hr style="border-color: #333; margin: 40px 0;">

    <!-- ГРАФИК ВЕСА -->
    <h2 class="reveal" style="font-size: 1.5rem;">Трекер веса</h2>
    <div class="weight-input-card reveal" style="margin-top: 15px;">
        <div class="weight-input-group">
            <label>Текущий вес (кг):</label>
            <input type="number" id="current-weight" placeholder="75.5" step="0.1">
            <button class="btn" onclick="saveWeight()">Записать</button>
        </div>
        <div class="weight-input-group" style="margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;">
            <label>Цель (кг):</label>
            <input type="number" id="target-weight" placeholder="70" step="0.1" onchange="saveTargetWeight()">
        </div>
    </div>
    <div class="chart-container reveal" style="margin-top: 20px; background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); height: 300px;">
        <canvas id="weightChart"></canvas>
    </div>

    <!-- ЧЕК-ИН И ЭЙВА -->
    <div style="text-align: center; margin: 50px 0;">
        <button class="btn" style="font-size: 1.2rem; padding: 18px 40px;" onclick="askEvaAboutProgress()">✨ Спросить ЭЙВУ о прогрессе</button>
    </div>

</div>

<div id="footer-placeholder"></div>

<script src="script.js"></script>
<script>
  async function loadComponents() {
    try {
      const headerRes = await fetch('header.html');
      document.getElementById('header-placeholder').innerHTML = await headerRes.text();
      const footerRes = await fetch('footer.html');
      document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
      if (typeof updateCartCount === 'function') updateCartCount();
      
      const revealElements = document.querySelectorAll('.reveal');
      const revealOnScroll = new IntersectionObserver(function(entries, observer) {
          entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('active');
              observer.unobserve(entry.target);
          });
      }, { threshold: 0.15 });
      revealElements.forEach(el => revealOnScroll.observe(el));

    } catch (error) {
      console.error('Ошибка загрузки компонентов:', error);
    }
  }
  loadComponents();
</script>
</body>
</html>
